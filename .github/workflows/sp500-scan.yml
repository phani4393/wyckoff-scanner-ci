name: Wyckoff S&P 500 Scan

on:
  schedule:
    # GitHub Actions cron is fixed UTC and can't itself follow US DST, so
    # this is split into two entries keyed by month instead of one that
    # drifts an hour off "market close + buffer" for half the year:
    #   - Mar-Oct (US daylight time, EDT/UTC-4): 20:20 UTC = 4:20pm ET
    #   - Nov-Feb (US standard time, EST/UTC-5): 21:20 UTC = 4:20pm ET
    # DST's actual boundary (2nd Sun in March / 1st Sun in Nov) doesn't line
    # up exactly with calendar months, so there's still up to ~1hr drift in
    # the 1-2 week transition windows each March/November -- but that's a
    # small, bounded, self-healing gap instead of a full season of drift that
    # needed a manual nudge to fix.
    - cron: "20 20 * 3-10 1-5"
    - cron: "20 21 * 11,12,1,2 1-5"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python src/wyckoff_scanner.py
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
