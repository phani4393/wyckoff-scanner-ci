name: Wyckoff Watchlist Scan

on:
  schedule:
    # Same month-keyed DST split as sp500-scan.yml -- see that file for the
    # full explanation. Mar-Oct uses the daylight-time offset, Nov-Feb uses
    # the standard-time offset, so this self-adjusts without a manual nudge
    # (modulo the ~1-2 week transition windows each March/November).
    - cron: "35 20 * 3-10 1-5"
    - cron: "35 21 * 11,12,1,2 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python src/wyckoff_watchlist_scanner.py
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wyckoff-charts
          path: charts/
          retention-days: 14
          if-no-files-found: ignore
      # data/alerts_log.csv is written by alert_log.py during the scan above
      # -- this runner's filesystem is discarded when the job ends, so the
      # log has to be committed back to the repo to survive. if: always()
      # so alerts logged before a mid-run failure aren't lost either.
      - name: Persist alert log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- data/alerts_log.csv)" ]; then
            git add data/alerts_log.csv
            git commit -m "Log alerts from $(date -u +%Y-%m-%dT%H:%M:%SZ) watchlist run"
            git pull --rebase --autostash origin master
            git push
          else
            echo "No new alerts logged this run."
          fi
