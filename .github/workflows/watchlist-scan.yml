name: Wyckoff Watchlist Scan

on:
  schedule:
    # Same month-keyed DST split as sp500-scan.yml -- see that file for the
    # full explanation. Mar-Oct uses the daylight-time offset, Nov-Feb uses
    # the standard-time offset, so this self-adjusts without a manual nudge
    # (modulo the ~1-2 week transition windows each March/November).
    - cron: "35 20 * 3-10 1-5"
    - cron: "35 21 * 11,12,1,2 1-5"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python src/wyckoff_watchlist_scanner.py
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wyckoff-charts
          path: charts/
          retention-days: 14
          if-no-files-found: ignore
